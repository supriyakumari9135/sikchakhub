# ==============================================================================
# SikchaKhub.AI - Enterprise Nginx Reverse Proxy Configuration
# Deployment Target: Contabo VPS (Ubuntu 22.04 / 24.04 LTS)
# Domain: api.sikchakhub.in (Backend API) & sikchakhub.in (Frontend Proxy / CDN)
# ==============================================================================

# Rate limiting zones for DDoS and brute-force mitigation
limit_req_zone $binary_remote_addr zone=sikcha_api_limit:10m rate=100r/m;
limit_req_zone $binary_remote_addr zone=sikcha_auth_limit:10m rate=20r/m;

upstream sikchakhub_backend_cluster {
    server 127.0.0.1:5001 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# HTTP -> HTTPS Redirect for All Hostnames
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.sikchakhub.in sikchakhub.in www.sikchakhub.in;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# Backend API Virtual Host: api.sikchakhub.in
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.sikchakhub.in;

    # SSL Certificate Paths (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.sikchakhub.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sikchakhub.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # File upload payload limits (for PDF resumes & certificates up to 5MB)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Gzip Compression for JSON & API responses
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        application/json
        text/plain
        application/javascript
        text/css
        image/svg+xml;

    # Auth endpoints rate-limiting (login / registration protection)
    location /api/v1/auth/ {
        limit_req zone=sikcha_auth_limit burst=10 nodelay;
        proxy_pass http://sikchakhub_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static file uploads (Cached with aggressive browser caching)
    location /uploads/ {
        alias /var/www/sikchakhub/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # General API Routes
    location / {
        limit_req zone=sikcha_api_limit burst=40 nodelay;
        proxy_pass http://sikchakhub_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

